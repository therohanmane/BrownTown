<!DOCTYPE html>
<html lang="mr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>INBrownTown — Official Brand &amp; Digital Video Channel</title>
  <meta name="description" content="INBrownTown: Real Voices, Ground Truth & Cinematic Stories. Official media brand & video channel showcase across Pune & Maharashtra.">
  <meta name="keywords" content="INBrownTown, Video Channel, Ground Reports, Documentary, Interviews, Pune, Maharashtra, Community Media">
  <meta name="author" content="INBrownTown Media Network">

  <!-- OpenGraph / Social Cards -->
  <meta property="og:title" content="INBrownTown — Official Brand &amp; Video Channel">
  <meta property="og:description" content="Real Voices • Ground Truth • Cinematic Stories. Watch all official video productions directly on site.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?w=1200&auto=format&fit=crop&q=80">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Platform Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/showcase.css">

  <!-- Schema.org Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "INBrownTown",
    "url": "https://inbrowntown.com",
    "logo": "https://inbrowntown.com/assets/logo.png",
    "slogan": "Real Voices • Ground Truth • Cinematic Stories",
    "sameAs": [
      "https://youtube.com/@inbrowntown",
      "https://instagram.com/inbrowntown",
      "https://facebook.com/inbrowntown"
    ]
  }
  </script>
</head>
<body>

  <!-- ==================== 1. SITE HEADER (STICKY WITH SCROLL TRANSFORMATION) ==================== -->
  <header class="site-header" id="site-header">
    <div class="container main-header-row">
      <!-- Mobile Menu Toggle Button -->
      <button class="mobile-menu-toggle" id="mobile-drawer-toggle" onclick="Channel.toggleMobileDrawer()" aria-label="Open Navigation Menu">
        ☰
      </button>

      <!-- Brand Identity -->
      <a href="#hero" class="brand-logo-wrap" title="INBrownTown Home" onclick="Channel.scrollToSection('hero', event)">
        <div class="brand-symbol">IN</div>
        <div class="brand-text-block">
          <h1><span class="in-prefix">IN</span>BrownTown</h1>
          <div class="brand-tagline-sub">Digital Media &amp; Community Channel</div>
        </div>
      </a>

      <!-- Desktop Navigation Menu -->
      <nav class="nav-scroll-wrap">
        <ul class="main-nav-list" id="main-nav-list">
          <!-- Injected via Channel.renderHeaderNav() -->
        </ul>
      </nav>

      <!-- Header Utilities: Language & Theme -->
      <div class="header-action-group">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="mr">मराठी</button>
          <button class="lang-btn" data-lang="hi">हिन्दी</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>

        <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Dark/Light Mode">
          🌙
        </button>
      </div>
    </div>

    <!-- Glowing Dynamic Scroll Progress Bar -->
    <div class="scroll-progress-bar" id="scroll-progress-bar"></div>
  </header>

  <!-- ==================== 2. MOBILE DRAWER SLIDE-OVER ==================== -->
  <div class="mobile-drawer-backdrop" id="mobile-drawer-backdrop" onclick="Channel.closeMobileDrawer()">
    <div class="mobile-drawer" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <div class="brand-symbol" style="width:32px; height:32px; font-size:1rem;">IN</div>
          <strong style="font-size:1.1rem;">INBrownTown</strong>
        </div>
        <button class="modal-close-btn" onclick="Channel.closeMobileDrawer()">&times;</button>
      </div>
      <div class="drawer-body" id="mobile-drawer-links">
        <!-- Injected via Channel.renderHeaderNav() -->
      </div>
    </div>
  </div>

  <!-- ==================== 3. MAIN SHOWCASE SECTIONS ==================== -->
  <main>
    <!-- Section 1: Hero Cinematic Banner -->
    <section id="hero"></section>

    <!-- Section 2: Who We Are & Live Stats -->
    <section id="who-we-are"></section>

    <!-- Section 3: What We Do -->
    <section id="what-we-do"></section>

    <!-- Section 4: How We Help (Pillars) -->
    <section id="how-we-help"></section>

    <!-- Section 5: Content Showcase Tiles -->
    <section id="content"></section>

    <!-- Section 6: Curated Video Gallery & In-Page Modal Player -->
    <section id="videos"></section>

    <!-- Section 7: Social Proof / Testimonials -->
    <section id="testimonials"></section>

    <!-- Section 8: Work With Us / Sponsorships & Business Inquiry -->
    <section id="work-with-us"></section>
  </main>

  <!-- ==================== 4. SITE FOOTER ==================== -->
  <footer class="site-footer" id="contact">
    <!-- Rendered dynamically via Channel.renderFooter() -->
  </footer>

  <!-- ==================== 5. SCRIPTS ==================== -->
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/channel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
